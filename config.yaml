bot:
  username: "total_recaller_bot"
  pool_size: 10
  max_queue_size: 100
  max_file_size: 20971520
  telegram_api_url: "https://api.telegram.org"

database:
  retry:
    max_attempts: 3
    backoff: "1s"
  pool:
    max_open_conns: 25
    max_idle_conns: 5
    max_lifetime: "5m"
    max_idle_time: "1m"

transcriber:
  token_manager:
    scope: "SALUTE_SPEECH_PERS"
    url: "https://ngw.devices.sberbank.ru:9443/api/v2/oauth"
    refresh_interval: "29m"
  salute_url: "https://smartspeech.sber.ru/rest/v1"
  task_buffer_size: 100
  result_buffer_size: 100

llm:
  token_manager:
    scope: "GIGACHAT_API_PERS"
    url: "https://ngw.devices.sberbank.ru:9443/api/v2/oauth"
    refresh_interval: "29m"
  generate_model: "GigaChat-2"
  embedding_model: "Embeddings-2"
  task_buffer_size: 100
  result_buffer_size: 100

# Переменные окружения:
# TOTAL_RECALLER_BOT_TOKEN - токен Telegram бота
# TOTAL_RECALLER_DATABASE_DSN - строка подключения к базе данных
# TOTAL_RECALLER_TRANSCRIBER_TOKEN_MANAGER_CREDENTIALS - учетные данные для токен-менеджера транскрибера
# TOTAL_RECALLER_LLM_TOKEN_MANAGER_CREDENTIALS - учетные данные для токен-менеджера LLM